<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="500" height="340" fill="url(#certBg)" rx="16" />

  <!-- Certificate Frame Inner -->
  <rect x="25" y="25" width="450" height="290" rx="10" fill="#0b1120" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="8 4" />
  <rect x="35" y="35" width="430" height="270" rx="8" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" />

  <!-- Seal / Medal Motif -->
  <g transform="translate(250, 95)">
    <circle cx="0" cy="0" r="34" fill="#78350f" stroke="url(#goldBorder)" stroke-width="2" />
    <!-- Ribbon tails -->
    <polygon points="-8,30 -16,60 0,50 16,60 8,30" fill="#b45309" />
    <!-- Star -->
    <path d="M 0 -14 L 4 -4 L 14 -4 L 6 3 L 9 13 L 0 7 L -9 13 L -6 3 L -14 -4 L -4 -4 Z" fill="#fbbf24" />
  </g>

  <!-- Certificate Content Text -->
  <text x="250" y="180" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="bold" font-size="18">Certificate of Completion / Training</text>
  <text x="250" y="205" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="12">Industry Internship • Professional Coursework</text>

  <!-- Prompt Box -->
  <g transform="translate(90, 235)">
    <rect width="320" height="38" rx="8" fill="#1e293b" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
    <text x="160" y="24" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">📜 [Awaiting Certificate / Internship Image]</text>
  </g>
</svg>
