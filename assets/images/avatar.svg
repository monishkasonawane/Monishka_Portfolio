<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowAvatar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#avatarGrad)" stroke-width="4" filter="url(#glowAvatar)" />
  
  <!-- Outer circle base -->
  <circle cx="100" cy="100" r="92" fill="url(#innerGrad)" stroke="url(#avatarGrad)" stroke-width="2.5" />
  
  <!-- Decorative orbit rings -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 6" />

  <!-- Monogram Initials "MS" -->
  <text x="100" y="116" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="64" fill="url(#avatarGrad)" letter-spacing="1">MS</text>

  <!-- Small Code Accent Tag -->
  <g transform="translate(68, 140)">
    <rect width="64" height="22" rx="11" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="32" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#a5b4fc">&lt;dev/&gt;</text>
  </g>
</svg>
