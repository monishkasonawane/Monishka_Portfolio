<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Document Card Mockup -->
  <g transform="translate(60, 50)">
    <rect width="210" height="260" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <!-- Header -->
    <rect width="210" height="32" rx="10" fill="#334155" />
    <circle cx="20" cy="16" r="4" fill="#ef4444" />
    <circle cx="35" cy="16" r="4" fill="#eab308" />
    <circle cx="50" cy="16" r="4" fill="#22c55e" />
    <text x="80" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">document.txt</text>

    <!-- Document Lines -->
    <rect x="20" y="50" width="130" height="8" rx="4" fill="#6366f1" opacity="0.8" />
    <rect x="20" y="68" width="170" height="6" rx="3" fill="#475569" />
    <rect x="20" y="82" width="150" height="6" rx="3" fill="#475569" />
    <rect x="20" y="96" width="160" height="6" rx="3" fill="#475569" />
    <rect x="20" y="110" width="120" height="6" rx="3" fill="#475569" />

    <!-- Vectorized Badges -->
    <rect x="20" y="135" width="80" height="18" rx="4" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1" />
    <text x="32" y="148" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="9">TF-IDF: 0.89</text>

    <rect x="110" y="135" width="80" height="18" rx="4" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1" />
    <text x="122" y="148" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="9">Naive Bayes</text>

    <rect x="20" y="170" width="170" height="65" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.06)" />
    <text x="30" y="190" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">Predicted Class</text>
    <rect x="30" y="200" width="110" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="42" y="215" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">✓ Technology</text>
  </g>

  <!-- Connection Flow Arrows & Nodes -->
  <g>
    <!-- Arrow lines -->
    <path d="M 280 180 L 340 180" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="4 2" />
    <polygon points="345,180 338,175 338,185" fill="#a855f7" />

    <!-- Central Neural / ML Node -->
    <circle cx="390" cy="180" r="38" fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#glow)" />
    <text x="390" y="176" text-anchor="middle" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">AI / ML</text>
    <text x="390" y="192" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">CLASSIFIER</text>

    <!-- Outer Nodes -->
    <circle cx="490" cy="110" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="490" y="114" text-anchor="middle" fill="#38bdf8" font-size="9" font-family="sans-serif" font-weight="bold">NEWS</text>
    <line x1="422" y1="162" x2="475" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

    <circle cx="510" cy="180" r="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="510" y="184" text-anchor="middle" fill="#a855f7" font-size="9" font-family="sans-serif" font-weight="bold">TECH</text>
    <line x1="428" y1="180" x2="492" y2="180" stroke="#a855f7" stroke-width="1.5" opacity="0.8" />

    <circle cx="490" cy="250" r="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="490" y="254" text-anchor="middle" fill="#ec4899" font-size="9" font-family="sans-serif" font-weight="bold">HEALTH</text>
    <line x1="422" y1="198" x2="475" y2="240" stroke="#ec4899" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Floating Accuracy Pill -->
  <g transform="translate(370, 70)">
    <rect width="140" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="14" r="5" fill="#10b981" />
    <text x="36" y="18" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600">Model Accuracy: 94%</text>
  </g>
</svg>
