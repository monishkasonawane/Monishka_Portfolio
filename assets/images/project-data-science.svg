<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#dsBg)" rx="16" />

  <!-- Code editor / Jupyter header -->
  <g transform="translate(50, 40)">
    <rect width="500" height="280" rx="12" fill="#090d16" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <rect width="500" height="34" rx="12" fill="#131d2e" />
    <circle cx="20" cy="17" r="4" fill="#ef4444" />
    <circle cx="34" cy="17" r="4" fill="#eab308" />
    <circle cx="48" cy="17" r="4" fill="#22c55e" />
    <text x="75" y="21" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">eda_predictive_modeling.ipynb • Python 3</text>

    <!-- Data Chart left side -->
    <g transform="translate(30, 60)">
      <text x="0" y="0" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Model Accuracy Comparison (%)</text>

      <!-- Bar charts -->
      <!-- Bar 1 -->
      <text x="0" y="35" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">Naive Bayes</text>
      <rect x="110" y="24" width="160" height="14" rx="4" fill="url(#purpleBar)" />
      <text x="278" y="35" fill="#c084fc" font-size="10" font-family="'JetBrains Mono', monospace">94.2%</text>

      <!-- Bar 2 -->
      <text x="0" y="65" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">Logistic Reg</text>
      <rect x="110" y="54" width="145" height="14" rx="4" fill="url(#cyanBar)" />
      <text x="263" y="65" fill="#38bdf8" font-size="10" font-family="'JetBrains Mono', monospace">89.8%</text>

      <!-- Bar 3 -->
      <text x="0" y="95" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">Decision Tree</text>
      <rect x="110" y="84" width="135" height="14" rx="4" fill="#a855f7" opacity="0.8" />
      <text x="253" y="95" fill="#d8b4fe" font-size="10" font-family="'JetBrains Mono', monospace">86.5%</text>

      <!-- Line Graph mini -->
      <path d="M 0 170 Q 60 120 120 140 T 240 100 T 320 80" fill="none" stroke="#ec4899" stroke-width="2.5" />
      <circle cx="120" cy="140" r="4" fill="#ec4899" />
      <circle cx="240" cy="100" r="4" fill="#ec4899" />
      <circle cx="320" cy="80" r="4" fill="#ec4899" />
    </g>

    <!-- Confusion matrix right side -->
    <g transform="translate(360, 60)">
      <text x="0" y="0" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">Confusion Matrix</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="48" height="48" rx="4" fill="#4338ca" />
        <text x="24" y="28" fill="#ffffff" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">142</text>

        <rect x="52" y="0" width="48" height="48" rx="4" fill="#1e293b" />
        <text x="76" y="28" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">8</text>

        <rect x="0" y="52" width="48" height="48" rx="4" fill="#1e293b" />
        <text x="24" y="80" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">11</text>

        <rect x="52" y="52" width="48" height="48" rx="4" fill="#4338ca" />
        <text x="76" y="80" fill="#ffffff" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">139</text>
      </g>

      <!-- Libraries Used -->
      <g transform="translate(0, 130)">
        <rect width="105" height="22" rx="4" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
        <text x="8" y="15" fill="#a5b4fc" font-size="9" font-family="'JetBrains Mono', monospace">Pandas • NumPy</text>

        <rect y="28" width="105" height="22" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1" />
        <text x="8" y="43" fill="#d8b4fe" font-size="9" font-family="'JetBrains Mono', monospace">Scikit-learn</text>
      </g>
    </g>
  </g>
</svg>
