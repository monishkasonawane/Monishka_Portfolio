<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="480" fill="url(#photoGrad)" rx="24" />

  <!-- Ambient Light Circle -->
  <circle cx="200" cy="180" r="140" fill="url(#faceGlow)" />

  <!-- Geometric Grid Background Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
  </g>

  <!-- Stylized Female Developer Silhouette / Portrait Motif -->
  <g transform="translate(200, 190)" filter="url(#shadowFilter)">
    <!-- Base Glow Behind Head -->
    <circle cx="0" cy="-30" r="75" fill="#1e293b" stroke="url(#neonGlow)" stroke-width="3" />
    
    <!-- Hair / Head Shape -->
    <path d="M -50 -40 C -55 -100 55 -100 50 -40 C 60 -10 50 40 40 50 C 20 60 -20 60 -40 50 C -50 40 -60 -10 -50 -40 Z" fill="#0f172a" />
    
    <!-- Face Contour -->
    <path d="M -32 -25 C -35 25 -20 42 0 45 C 20 42 35 25 32 -25 C 25 -38 -25 -38 -32 -25 Z" fill="#cbd5e1" opacity="0.9" />
    
    <!-- Sleek Hair Strands -->
    <path d="M -45 -35 C -45 10 -28 35 -28 35 C -32 10 -25 -30 0 -45 C 25 -30 32 10 28 35 C 28 35 45 10 45 -35 C 45 -75 -45 -75 -45 -35 Z" fill="#312e81" opacity="0.95" />
    
    <!-- Eyes / Tech Glasses -->
    <rect x="-24" y="-12" width="20" height="11" rx="3" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <rect x="4" y="-12" width="20" height="11" rx="3" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <line x1="-4" y1="-7" x2="4" y2="-7" stroke="#818cf8" stroke-width="2" />
    
    <!-- Subtle Smile -->
    <path d="M -10 16 Q 0 24 10 16" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Torso / Shoulders -->
    <path d="M -85 130 C -85 70 -50 60 0 60 C 50 60 85 70 85 130 Z" fill="#1e1b4b" stroke="url(#neonGlow)" stroke-width="2" />
    <!-- Collar Detail -->
    <polygon points="0,95 -20,65 20,65" fill="#312e81" />
  </g>

  <!-- Monogram Initials Tag in Corner -->
  <g transform="translate(30, 30)">
    <rect width="48" height="48" rx="14" fill="#0f172a" stroke="url(#neonGlow)" stroke-width="1.5" />
    <text x="24" y="31" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="url(#neonGlow)">MS</text>
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(260, 36)">
    <rect width="110" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <text x="28" y="18" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600">Active Now</text>
  </g>

  <!-- Lower Persona Info Card -->
  <g transform="translate(30, 360)">
    <rect width="340" height="90" rx="18" fill="#0f172a" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="20" y="32" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="700" font-size="18">Monishka Sonawane</text>
    <text x="20" y="52" fill="#818cf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12">Computer Engineering Student • RCPIT</text>
    <text x="20" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">📍 Shirpur, Maharashtra, India</text>

    <!-- Code Pill -->
    <g transform="translate(245, 18)">
      <rect width="75" height="24" rx="12" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1" />
      <text x="37" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#a5b4fc">&lt;dev/&gt;</text>
    </g>
  </g>
</svg>
