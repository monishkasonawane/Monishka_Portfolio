<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="sympGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#sympGrad)" rx="16" />

  <!-- Presentation / Stage Screen Motif in Center -->
  <g transform="translate(190, 100)">
    <rect width="220" height="125" rx="8" fill="#042f2e" stroke="url(#emeraldGold)" stroke-width="2" />
    <!-- Stand -->
    <rect x="100" y="125" width="20" height="20" fill="#0f766e" />
    <rect x="75" y="145" width="70" height="6" rx="3" fill="#14b8a6" />

    <!-- Project chart on screen -->
    <path d="M 20 100 L 60 70 L 100 85 L 140 45 L 180 55 L 200 25" fill="none" stroke="#34d399" stroke-width="3" />
    <circle cx="140" cy="45" r="4" fill="#fbbf24" />
    <circle cx="200" cy="25" r="4" fill="#fbbf24" />
    <text x="110" y="112" text-anchor="middle" fill="#99f6e4" font-family="'JetBrains Mono', monospace" font-size="9">Project Exhibition & Demo</text>
  </g>

  <!-- Tag badge -->
  <g transform="translate(185, 40)">
    <rect width="230" height="30" rx="15" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <text x="115" y="20" text-anchor="middle" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">🎓 SYMPOSIUM & EXHIBITION</text>
  </g>

  <!-- Title & Description -->
  <text x="300" y="285" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="20">Technical Paper & Project Presentation</text>
  <text x="300" y="310" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">Inter-College Competition • Live Demo & Evaluation Jury</text>

  <!-- Placeholder Prompt -->
  <g transform="translate(140, 332)">
    <rect width="320" height="32" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="160" y="21" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">📷 [Awaiting Your Event Photo to Replace]</text>
  </g>
</svg>
